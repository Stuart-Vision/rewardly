name: rewardly

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rewardly
      POSTGRES_PASSWORD: rewardly
      POSTGRES_DB: rewardly
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rewardly"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://rewardly:rewardly@postgres:5432/rewardly
      PORT: 8080
    ports: ["8080:8080"]
