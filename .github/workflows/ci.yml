name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rewardly
          POSTGRES_PASSWORD: rewardly
          POSTGRES_DB: rewardly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rewardly"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Unit and integration tests (with the race detector)
        run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://rewardly:rewardly@localhost:5432/rewardly_test
      - name: Docker image builds
        run: docker build -t rewardly-api .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
